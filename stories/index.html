<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Visuels Déclic — pro</title>
    <meta name="theme-color" content="#080808">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #080808;
        color: #fffdfa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      }
      header {
        padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 8px;
      }
      header p {
        margin: 0;
        color: #e51d32;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      header h1 { margin: 8px 0 0; font-size: 26px; letter-spacing: -0.05em; }
      h2.group {
        margin: 28px 20px 8px;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #aaa39b;
      }
      .story { padding: 0 16px 32px; }
      .story h3 { margin: 0 0 10px; font-size: 14px; color: #aaa39b; }
      .story img {
        display: block;
        width: 100%;
        max-width: 420px;
        height: auto;
        border-radius: 18px;
        background: #111;
      }
    </style>
  </head>
  <body>
    <header>
      <p>V2 · plus propre · icône sur chaque visuel</p>
      <h1>10 modèles</h1>
    </header>

    <h2 class="group">Fiches App Store</h2>
    <section class="story">
      <h3>1 — Tout pour arrêter</h3>
      <a href="declic-pro-fiche-01.png"><img src="declic-pro-fiche-01.png" alt="Fiche 1"></a>
    </section>
    <section class="story">
      <h3>2 — Liste à droite</h3>
      <a href="declic-pro-fiche-02.png"><img src="declic-pro-fiche-02.png" alt="Fiche 2"></a>
    </section>
    <section class="story">
      <h3>3 — Grille sous le téléphone</h3>
      <a href="declic-pro-fiche-03.png"><img src="declic-pro-fiche-03.png" alt="Fiche 3"></a>
    </section>
    <section class="story">
      <h3>4 — Fond sombre</h3>
      <a href="declic-pro-fiche-04.png"><img src="declic-pro-fiche-04.png" alt="Fiche 4"></a>
    </section>
    <section class="story">
      <h3>5 — Fond jaune</h3>
      <a href="declic-pro-fiche-05.png"><img src="declic-pro-fiche-05.png" alt="Fiche 5"></a>
    </section>

    <h2 class="group">Style site</h2>
    <section class="story">
      <h3>1 — Cinéma</h3>
      <a href="declic-pro-site-01.png"><img src="declic-pro-site-01.png" alt="Site 1"></a>
    </section>
    <section class="story">
      <h3>2 — Grille crème</h3>
      <a href="declic-pro-site-02.png"><img src="declic-pro-site-02.png" alt="Site 2"></a>
    </section>
    <section class="story">
      <h3>3 — Rouge</h3>
      <a href="declic-pro-site-03.png"><img src="declic-pro-site-03.png" alt="Site 3"></a>
    </section>
    <section class="story">
      <h3>4 — Manifeste</h3>
      <a href="declic-pro-site-04.png"><img src="declic-pro-site-04.png" alt="Site 4"></a>
    </section>
    <section class="story">
      <h3>5 — Split</h3>
      <a href="declic-pro-site-05.png"><img src="declic-pro-site-05.png" alt="Site 5"></a>
    </section>
  </body>
</html>
