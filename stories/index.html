<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Visuels Déclic — App Store + site</title>
    <meta name="theme-color" content="#080808">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #080808;
        color: #fffdfa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      }
      header {
        padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 8px;
      }
      header p {
        margin: 0;
        color: #e51d32;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      header h1 {
        margin: 8px 0 0;
        font-size: 28px;
        letter-spacing: -0.05em;
      }
      h2.group {
        margin: 28px 20px 8px;
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #aaa39b;
      }
      .story {
        padding: 0 16px 32px;
      }
      .story h3 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 650;
        color: #aaa39b;
      }
      .story img {
        display: block;
        width: 100%;
        max-width: 420px;
        height: auto;
        border-radius: 18px;
        background: #111;
      }
    </style>
  </head>
  <body>
    <header>
      <p>Propositions</p>
      <h1>10 visuels Déclic</h1>
    </header>

    <h2 class="group">Style App Store</h2>
    <section class="story">

    </section>
    <section class="story">
      <h3>02 — Protection</h3>
      <a href="declic-asc-02-protection.png"><img src="declic-asc-02-protection.png" alt="Ferme la porte au jeu"></a>
    </section>
    <section class="story">
      <h3>03 — L’envie</h3>
      <a href="declic-asc-03-envie.png"><img src="declic-asc-03-envie.png" alt="L’envie n’est pas un ordre"></a>
    </section>
    <section class="story">
      <h3>04 — Parcours</h3>
      <a href="declic-asc-04-parcours.png"><img src="declic-asc-04-parcours.png" alt="Regarde ce que tu récupères"></a>

    <section class="story">
      <h3>05 — Confiance</h3>

    </section>
    <section class="story">
      <h3>02 — Protection</h3>
      <a href="declic-site-02-protection.png"><img src="declic-site-02-protection.png" alt="Protection"></a>
    </section>
    <section class="story">
      <h3>03 — L’envie</h3>
      <a href="declic-site-03-envie.png"><img src="declic-site-03-envie.png" alt="Quand ça monte"></a>
