<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <title>Stories Déclic — propositions</title>
    <meta name="theme-color" content="#080808">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #080808;
        color: #fffdfa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      }
      header {
        padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 12px;
      }
      header p {
        margin: 0;
        color: #e51d32;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      header h1 {
        margin: 8px 0 0;
        font-size: 28px;
        letter-spacing: -0.05em;
      }
      .story {
        padding: 0 16px 36px;
      }
      .story h2 {
        margin: 0 0 10px;
        font-size: 14px;
        font-weight: 650;
        color: #aaa39b;
      }
      .story img {
        display: block;
        width: 100%;
        max-width: 420px;
        height: auto;
        border-radius: 18px;
        background: #111;
      }
      a {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <p>Propositions</p>
      <h1>Stories Déclic</h1>
    </header>
    <section class="story">
      <h2>01 — Vue d’ensemble</h2>
      <a href="declic-story-01-tout.png"><img src="declic-story-01-tout.png" alt="Le jeu s’arrête ici"></a>
    </section>
    <section class="story">
      <h2>02 — Protection</h2>
      <a href="declic-story-02-protection.png"><img src="declic-story-02-protection.png" alt="Ferme la porte au jeu"></a>
    </section>
    <section class="story">
      <h2>03 — L’envie</h2>
      <a href="declic-story-03-envie.png"><img src="declic-story-03-envie.png" alt="L’envie n’est pas un ordre"></a>
    </section>
    <section class="story">
      <h2>04 — Parcours</h2>
      <a href="declic-story-04-parcours.png"><img src="declic-story-04-parcours.png" alt="Regarde ce que tu récupères"></a>
    </section>
    <section class="story">
      <h2>05 — Manifeste</h2>
      <a href="declic-story-05-confiance.png"><img src="declic-story-05-confiance.png" alt="Pas un sermon"></a>
    </section>
    <section class="story">
      <h2>06 — Affiche</h2>
      <a href="declic-story-06-affiche.png"><img src="declic-story-06-affiche.png" alt="Affiche Le jeu s’arrête ici"></a>
    </section>
  </body>
</html>
