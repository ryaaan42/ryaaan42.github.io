<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Déclic — la pub</title>
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://declicapp.fr/pub/" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #0a0a0b; color: #f5f5f4; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
        padding: calc(20px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
      }
      a { color: inherit; }
      header p {
        margin: 0;
        color: #e11d30;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 { margin: 8px 0 6px; font-size: 28px; letter-spacing: -0.04em; }
      .note { margin: 0 0 20px; color: #8a8a8e; font-size: 15px; line-height: 1.4; }
      .frame {
        margin: 0 auto;
        max-width: 420px;
        border-radius: 22px;
        overflow: hidden;
        background: #111;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      video {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
        background: #0a0a0b;
      }
      nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 22px auto 0;
        max-width: 420px;
      }
      nav a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 999px;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
      }
      .store { background: #e11d30; color: #fff; }
      .back { border: 1px solid #2a2a2c; }
    </style>
  </head>
  <body>
    <header>
      <p>Déclic</p>
      <h1>La pub</h1>
      <p class="note">11 secondes. Tu peux lancer le son toi-même, il n’y en a pas.</p>
    </header>
    <div class="frame">
      <video
        controls
        playsinline
        webkit-playsinline
        muted
        autoplay
        loop
        preload="auto"
        src="./declic-ferme-la-porte.mp4"
      >
        Ta vidéo est là :
        <a href="./declic-ferme-la-porte.mp4">ouvrir le fichier</a>
      </video>
    </div>
    <nav>
      <a class="store" href="https://apps.apple.com/fr/app/id6802540340">App Store</a>
      <a class="back" href="/">Retour au site</a>
    </nav>
  </body>
</html>
